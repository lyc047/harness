[project]
name = "harness"
version = "0.1.0"
description = "Python production-grade AI agent harness (LLM tool loop, MCP, multi-agent)."
readme = "README.md"
authors = [
    { name = "lyc047", email = "1165970306@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
harness = "harness.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

# Use the Tsinghua PyPI mirror by default (pypi.org is intermittently
# unreachable on this network). Override with `--index-url` if needed.
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # function-call-in-default-argument (deliberate in config)

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]
